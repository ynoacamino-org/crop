services:
  traefik:
    image: "traefik:v3.4"
    container_name: crop-traefik-dev
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml:ro
    command:
      - "--configFile=/etc/traefik/traefik.yml"

  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: crop-libsql-dev
    environment:
      SQLD_NODE_PRIMARY_URL: "file:primary.db"
    volumes:
      - libsql_data:/var/lib/sqld
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: crop-garage-dev
    restart: unless-stopped
    env_file:
      - ./storage/.env.dev
    environment:
      GARAGE_RPC_LISTEN_ADDR: "[::]:3901"
      GARAGE_RPC_PUBLIC_ADDR: "crop-garage-dev:3901"
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:-d9316abbd839709669eeca2b449aba2a732949819ea933bab2a1514e9fe00a56}"
      GARAGE_S3_API_LISTEN_ADDR: "[::]:3900"
      GARAGE_S3_BUCKET_DEFAULT_ALLOW: "true"
    volumes:
      - garage_data:/var/lib/garage
      - ./storage/garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"
      - "3901:3901"

  redis:
    image: redis:7-alpine
    container_name: crop-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  libsql_data:
  garage_data:
  redis_data:
