services:
  kong:
    image: kong:3.9
    container_name: crop-kong-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.dev.yml:/kong/kong.yml

  database:
    image: postgres:18
    container_name: crop-database-dev
    env_file:
      - ./database/.env.dev
    ports:
      - "5432:5432"

  garage:
    image: garage:latest
    container_name: crop-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_LISTEN_ADDR: "[::]:3901"
      GARAGE_RPC_PUBLIC_ADDR: "crop-garage:3901"
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:-dev-rpc-secret-change-me}"
      GARAGE_S3_API_LISTEN_ADDR: "[::]:3900"
      GARAGE_S3_BUCKET_DEFAULT_ALLOW: "true"
      GARAGE_DEFAULT_ACCESS_KEY: "GKc7b6103f2655e2b34cd0e659cada57c7"
      GARAGE_DEFAULT_SECRET_KEY: "c5b3b89344ba4f7990045374e4fc7115df9f74e4162e05e760b16e6ca819cd91"
      GARAGE_DEFAULT_BUCKET: "crop"
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"
      - "3901:3901"

  storage-init:
    image: minio/mc:latest
    container_name: crop-storage-init-dev
    env_file:
      - ./storage/.env.dev
    volumes:
      - ./storage:/data
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set minio http://storage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb minio/crop-media;
      mc anonymous set-json /data/policy.json minio/crop-media;
      exit 0;
      "
