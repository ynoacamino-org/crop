metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1
consistency_mode = "consistent"

rpc_bind_addr = "[::]:3901"

s3_api_bind_addr = "[::]:3900"

[s3_api]
s3_region = "garage"
root_domain = ".s3.garage.localhost"
root_bucket = "crop"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-admin-token-change-me"
