query RecentLegalCases($take: Int, $skip: Int, $filter: LegalCaseFilter) {
  legalCases(take: $take, skip: $skip, filter: $filter) {
    items {
      id
      caseNumber
      caseName
      slug
      summary
      parties
      plaintiff
      defendant
      jurisdiction
      caseType {
        id
        name
        slug
        color
        icon
      }
      caseDate
      resolutionDate
      createdAt
      court {
        id
        name
        type
        jurisdiction
      }
    }
    pageInfo {
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}
