query LegalCase($id: String, $slug: String, $caseNumber: String) {
  legalCase(id: $id, slug: $slug, caseNumber: $caseNumber) {
    id
    caseNumber
    caseName
    slug
    summary
    parties
    plaintiff
    defendant
    judges
    verdict
    legalBasis
    jurisdiction
    caseType
    caseDate
    resolutionDate
    createdAt
    updatedAt
    court {
      id
      name
      type
      jurisdiction
      description
    }
    articles {
      id
      title
      slug
      excerpt
      status
      publishedAt
      createdAt
    }
  }
}
