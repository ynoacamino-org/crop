query RecentLegalCases(
  $take: Int
  $skip: Int
  $search: String
  $jurisdiction: String
  $caseType: String
  $courtId: String
) {
  legalCases(
    take: $take
    skip: $skip
    search: $search
    jurisdiction: $jurisdiction
    caseType: $caseType
    courtId: $courtId
  ) {
    id
    caseNumber
    caseName
    summary
    parties
    plaintiff
    defendant
    jurisdiction
    caseType
    caseDate
    resolutionDate
    createdAt
    court {
      id
      name
      type
      jurisdiction
    }
  }
}
