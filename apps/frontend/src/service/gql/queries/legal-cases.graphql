query RecentLegalCases(
  $take: Int
  $skip: Int
  $search: String
  $jurisdiction: String
  $caseTypeId: String
  $courtId: String
) {
  legalCases(
    take: $take
    skip: $skip
    search: $search
    jurisdiction: $jurisdiction
    caseTypeId: $caseTypeId
    courtId: $courtId
  ) {
    items {
      id
      caseNumber
      caseName
      slug
      summary
      parties
      plaintiff
      defendant
      jurisdiction
      caseType {
        id
        name
        slug
        color
        icon
      }
      caseDate
      resolutionDate
      createdAt
      court {
        id
        name
        type
        jurisdiction
      }
    }
    pageInfo {
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}
