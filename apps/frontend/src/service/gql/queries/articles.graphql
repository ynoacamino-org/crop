query RecentArticles($take: Int, $skip: Int) {
  articles(take: $take, skip: $skip, status: "PUBLISHED") {
    id
    title
    slug
    excerpt
    publishedAt
    readingTimeMin
    views
    author {
      id
      name
      image
    }
    featuredImage {
      id
      url
      alt
    }
    categories {
      id
      name
      slug
    }
    tags {
      id
      name
      slug
    }
  }
}
