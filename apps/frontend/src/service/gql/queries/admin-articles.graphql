# Query for admin to get all articles
query AdminArticles($take: Int, $skip: Int, $search: String) {
  articles(take: $take, skip: $skip, search: $search) {
    items {
      id
      title
      slug
      excerpt
      status
      publishedAt
      createdAt
      updatedAt
      views
      author {
        id
        name
        email
      }
      categories {
        id
        name
      }
    }
    pageInfo {
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}
